
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      padding: 40px 16px;
    }

    .profile {
      max-width: 450px;
      margin: auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px #00000015;
    }

    h1 {
      color: #1d4ed8;
    }

    .label {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="profile">
    <h1>Student Profile</h1>
    <p><span class="label">Name:</span> Muhammad Afnan</p>
    <p><span class="label">Student ID:</span> 56377</p>
    <p><span class="label">Program:</span> BS Information Technology</p>
    <p><span class="label">Semester:</span> 7th</p>
    <p><span class="label">Course:</span> DevOps</p>
  </div>
</body>
</html>
